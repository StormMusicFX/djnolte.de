<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="djGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3245"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Vinyl Disc) -->
  <circle cx="256" cy="256" r="240" fill="url(#vinylShine)" stroke="#00d2ff" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Center Label -->
  <circle cx="256" cy="256" r="80" fill="url(#djGrad)"/>

  <!-- Center Hole -->
  <circle cx="256" cy="256" r="22" fill="#0b0e14" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Headphones Arc Overlay -->
  <path d="M 120 270 A 136 136 0 0 1 392 270" fill="none" stroke="#00d2ff" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Left Ear Cup -->
  <rect x="100" y="250" width="34" height="64" rx="17" fill="url(#djGrad)"/>
  
  <!-- Right Ear Cup -->
  <rect x="378" y="250" width="34" height="64" rx="17" fill="url(#djGrad)"/>
</svg>
